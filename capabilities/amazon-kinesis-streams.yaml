      path: /streams
      operations:
      - name: createstream
        method: POST
        description: Amazon Kinesis Create Stream
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: liststreams
        method: GET
        description: Amazon Kinesis List Streams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: streams-StreamName
      path: /streams/{StreamName}
      operations:
      - name: deletestream
        method: DELETE
        description: Amazon Kinesis Delete Stream
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: StreamName
          in: path
          type: string
          description: The name of the stream.
          required: true
    - name: streams-StreamName-records
      path: /streams/{StreamName}/records
      operations:
      - name: putrecord
        method: POST
        description: Amazon Kinesis Put Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: StreamName
          in: path
          type: string
          description: The stream name.
          required: true
      - name: getrecords
        method: GET
        description: Amazon Kinesis Get Records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: StreamName
          in: path
          type: string
          description: The stream name.
          required: true
    - name: streams-StreamName-records-batch
      path: /streams/{StreamName}/records/batch
      operations:
      - name: putrecords
        method: POST
        description: Amazon Kinesis Put Records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: StreamName
          in: path
          type: string
          description: The stream name.
