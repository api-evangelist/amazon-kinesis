name: Amazon Kinesis
description: >-
  Amazon Kinesis makes it easy to collect, process, and analyze real-time streaming data so you can get timely insights
  and react quickly to new information. Amazon Kinesis offers key capabilities to cost-effectively process streaming
  data at any scale, along with the flexibility to choose the tools that best suit the requirements of your application.
