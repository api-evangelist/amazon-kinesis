specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Amazon Kinesis
providerId: amazon-kinesis
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Amazon
  - AWS
  - Streaming
  - Data Streams
  - Real-Time
  - Analytics
description: Amazon Kinesis Data Streams uses pay-as-you-go pricing with three modes - On-demand Standard
  (per GB ingested/retrieved plus per-stream-hour), On-demand Advantage (per GB with a 25 MB/s minimum
  account commitment), and Provisioned (per shard-hour plus PUT payload units). Extended retention, Enhanced
  Fan-Out, and long-term retention are billed separately. Prices listed are us-east-1.
sources:
  - https://aws.amazon.com/kinesis/data-streams/pricing/
plans:
  - id: amazon-kinesis-on-demand-standard
    name: On-Demand Standard
    type: usage-based
    description: Pay per GB written and retrieved with a per-stream hourly fee. Suited for unpredictable
      workloads.
    entries:
      - label: Data ingest
        name: ondemand_data_in
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.08'
        userMultiplied: false
      - label: Data retrieval
        name: ondemand_data_out
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.040'
        userMultiplied: false
      - label: Per-stream hourly fee
        name: ondemand_stream_hour
        type: metered
        metric: stream-hour
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.040'
        userMultiplied: false
    elements:
      - name: 24-hour default retention
      - name: Auto-scaling capacity
      - name: Enhanced Fan-Out (charged separately)
  - id: amazon-kinesis-on-demand-advantage
    name: On-Demand Advantage
    type: usage-based
    description: Discounted per-GB rates in exchange for a 25 MB/s minimum ingestion and retrieval commitment
      at the account level. No per-stream hourly fee, no Enhanced Fan-Out surcharge.
    entries:
      - label: Data ingest
        name: advantage_data_in
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.032'
        userMultiplied: false
      - label: Data retrieval
        name: advantage_data_out
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.016'
        userMultiplied: false
    elements:
      - name: 25 MB/s minimum commitment
      - name: Enhanced Fan-Out included
      - name: No per-stream-hour charge
  - id: amazon-kinesis-provisioned
    name: Provisioned
    type: usage-based
    description: Reserve shards for predictable throughput. Each shard supports 1 MB/s or 1000 records/s
      ingest and 2 MB/s retrieval.
    entries:
      - label: Shard hour
        name: shard_hour
        type: metered
        metric: shard-hour
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.015'
        userMultiplied: false
      - label: PUT payload units (25 KB)
        name: put_payload_units
        type: metered
        metric: put-payload-unit
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1000000
        price: '0.014'
        userMultiplied: false
      - label: Extended retention (24h to 7 days)
        name: extended_retention
        type: metered
        metric: shard-hour
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.020'
        userMultiplied: false
      - label: Enhanced Fan-Out consumer-shard
        name: efo_consumer_shard
        type: metered
        metric: consumer-shard-hour
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.015'
        userMultiplied: false
      - label: Enhanced Fan-Out data retrieval
        name: efo_data_retrieval
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.013'
        userMultiplied: false
      - label: Long-term retention storage (7 to 365 days)
        name: long_term_storage
        type: metered
        metric: gb-month
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: '0.023'
        userMultiplied: false
      - label: Long-term retention retrieval
        name: long_term_retrieval
        type: metered
        metric: gb
        limit: -1
        timeFrame: usage
        geo: US
        unit: 1
        price: '0.021'
        userMultiplied: false
    elements:
      - name: Predictable per-shard capacity
      - name: 24-hour default retention free
      - name: Configurable shard count
maintainers:
  - name: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
  - name: Amazon Web Services
    email: support@aws.amazon.com
    url: https://aws.amazon.com
