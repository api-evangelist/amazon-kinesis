specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Amazon Kinesis
providerId: amazon-kinesis
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - AWS
  - Streaming
  - Kinesis
  - Cost Management
description: 'FOCUS-aligned FinOps for Amazon Kinesis Data Streams: per-GB ingest/retrieval and per-shard-hour
  charges across On-Demand and Provisioned modes, with separately metered Enhanced Fan-Out, extended
  retention, and long-term storage.'
sources:
  - https://aws.amazon.com/kinesis/data-streams/pricing/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Amazon Web Services, Inc.
serviceCategory: Analytics / Streaming
billingModel:
  pricingCategory: Pay-As-You-Go
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
focusColumns:
  ServiceName: Amazon Kinesis Data Streams
  ServiceCategory: Analytics
  ServiceSubcategory: Streaming
  ProviderName: AWS
  PublisherName: Amazon Web Services, Inc.
  InvoiceIssuerName: Amazon Web Services, Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: data_ingested_gb
    unit: GB
    aggregation: sum
    dimensions:
      - region
      - stream_name
      - capacity_mode
  - name: data_retrieved_gb
    unit: GB
    aggregation: sum
    dimensions:
      - region
      - stream_name
      - consumer_type
  - name: shard_hours
    unit: shard-hour
    aggregation: sum
    dimensions:
      - region
      - stream_name
  - name: stream_hours
    unit: stream-hour
    aggregation: sum
    dimensions:
      - region
      - stream_name
      - capacity_mode
  - name: put_payload_units
    unit: PUT-payload-unit
    aggregation: sum
    dimensions:
      - region
      - stream_name
  - name: efo_consumer_shard_hours
    unit: consumer-shard-hour
    aggregation: sum
    dimensions:
      - region
      - stream_name
      - consumer_arn
  - name: long_term_storage_gb_month
    unit: GB-month
    aggregation: sum
    dimensions:
      - region
      - stream_name
principles:
  - name: Visibility
    description: Use CloudWatch Kinesis metrics (IncomingBytes, IncomingRecords, GetRecords.IteratorAgeMilliseconds)
      and the AWS CUR / FOCUS export for per-stream cost.
  - name: Allocation
    description: Tag streams with Environment, Team, Pipeline; enable cost allocation tags in Billing.
  - name: Optimization
    description: Choose On-Demand for spiky workloads, Provisioned for steady throughput; aggregate small
      records via KPL to reduce PUT payload units; size retention to match consumer SLA; consider On-Demand
      Advantage at over 25 MB/s baseline.
  - name: Accountability
    description: Set AWS Budgets per stream tag, alert on iterator-age (consumer lag), and review monthly
      shard utilization for right-sizing.
maintainers:
